plugins {
    id 'dagger.hilt.android.plugin'
    alias(libs.plugins.google.services)
    alias(libs.plugins.about)
    alias(libs.plugins.kotlin.compose.compiler)
    id 'com.bugsnag.android.gradle'
}

android {
    buildFeatures {
        compose true
        buildConfig = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId "com.savvasdalkitsis.uhuruphotos"
        minSdk 24
        targetSdk 36
        versionCode 271
        versionName "0.0.271"

        manifestPlaceholders = [
                bugSnagApiKey: System.getenv("BUGSNAG_API_KEY") ?: "DUMMY-KEY",
        ]

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file("keystore/keystore.jks")
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias System.getenv("KEYSTORE_ALIAS")
            keyPassword System.getenv("KEYSTORE_PASS")
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            proguardFiles fileTree(dir: "proguards", include: ["*.pro"]).asList().toArray()

            signingConfig signingConfigs.release
        }
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/AL2.0'
            excludes += '/META-INF/LGPL2.1'
            excludes += '/META-INF/versions/*'
        }
    }
    namespace 'com.savvasdalkitsis.uhuruphotos'
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    coreLibraryDesugaring(libs.desugar)
    implementation(
            libs.accompanist.systemui,
            libs.androidx.activity,
                        libs.androidx.compose.material.windowsize,
            libs.androidx.compose.ui,
            libs.androidx.splash,
            libs.androidx.work.hilt,
            libs.bundles.autodagger,
            libs.bugsnag,
            libs.bugsnag.performance,
            libs.hilt,
            libs.log4k,
            libs.permissions.base,
            project(":feature:auth:domain:api"),
            project(":feature:auth:view:api"),
            project(":feature:download:domain:api"),
            project(":feature:home:view:api"),
            project(":feature:settings:domain:api"),
            project(":foundation:activity:api"),
            project(":foundation:image:api"),
            project(":foundation:initializer:api"),
            project(":foundation:log:api"),
            project(":foundation:map:api"),
            project(":foundation:navigation:api"),
            project(":foundation:ui:api"),
            project(":foundation:ui:implementation"),
            project(":foundation:video:api"),
            project(":app:implementation"),
    )
    debugImplementation(
            libs.leaks,
    )
    testImplementation(
            libs.bundles.ui.test,
            libs.junit,
            libs.mockk,
    )
}

tasks.register('writeLinkageClasspath') {
    def output = layout.buildDirectory.file('linkage/release-classpath.txt')
    def libraries = configurations.named('releaseRuntimeClasspath').get().incoming.artifactView {
        attributes { attribute(Attribute.of('artifactType', String), 'android-classes-jar') }
        componentFilter { it instanceof ModuleComponentIdentifier }
    }.artifacts
    def platform = android.bootClasspath
    def resources = files(tasks.named('processDebugResources')).filter { it.name == 'R.jar' }
    inputs.files(libraries.artifactFiles).withNormalizer(ClasspathNormalizer)
    inputs.files(platform).withNormalizer(ClasspathNormalizer)
    inputs.files(resources).withNormalizer(ClasspathNormalizer)
    outputs.file(output)
    doLast {
        def lines = libraries.artifacts.collect { "${it.id.componentIdentifier.displayName}\t${it.file}" }
        lines += platform.collect { "platform\t${it}" }
        lines += resources.collect { "generated:R:debug\t${it}" }
        output.get().asFile.text = lines.join('\n')
    }
}
